<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DELIPIT PORTAL｜表示幅の確認</title><style>body{margin:0;background:#292d30;color:#eee;font:14px sans-serif}nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:15px;flex-wrap:wrap}button,a{border:1px solid #b5965d;background:#101516;color:#eee;padding:10px;border-radius:4px;cursor:pointer}iframe{display:block;width:390px;height:840px;max-width:none;margin:auto;border:0;background:#0b0d0e}main{overflow:auto;padding:5px 0 30px}p{text-align:center;font-size:12px;color:#ccc}</style><nav><b>表示幅を確認</b><button data-width="375">375px</button><button data-width="390">390px</button><button data-width="430">430px</button><button data-width="768">768px</button><button data-width="1280">1280px</button><a href="index.html">通常表示へ</a></nav><p>枠内をスクロールできます。iframeのCSS幅での確認です。実機確認とは区別します。</p><main><iframe title="トップページ試作" src="index.html"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px'});</script></html>
