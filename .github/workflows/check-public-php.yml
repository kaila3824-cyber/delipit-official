name: Check public PHP files

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-php-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject executable PHP or private key markers in public files
        run: python scripts/check_legacy_php_release.py
