name: Update latest note article

on:
  # Scheduled updates retired: the current index.html uses native DRIVER NOTE cards
  # and no longer contains NOTE_LATEST_START / NOTE_LATEST_END markers.
  # Keep manual dispatch only for legacy maintenance; no hourly failure emails.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest note article
        run: python scripts/update_note_latest.py

      - name: Commit update when changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No note update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update latest note article"
          git push
