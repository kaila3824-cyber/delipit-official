<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>DRIVER NEWS | DELIPIT</title><meta content="軽貨物ドライバーに関係する法令・制度、安全、税・お金、物流などの公的な一次情報をまとめるDELIPIT DRIVER NEWS。" name="description"/><meta content="index,follow" name="robots"/><link href="https://delipit.jp/driver-news.html" rel="canonical"/><link href="/assets/delipit-web-icon-192.png" rel="icon" sizes="192x192" type="image/png"/><style>:root{--bg:#080909;--panel:#111315;--text:#f7f4ed;--muted:#aaa9a5;--gold:#e5ae42;--line:#2a2926;--max:1100px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -8%,#30230e 0,#0d0d0c 26%,var(--bg) 54%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.75}a{color:inherit;text-decoration:none}.wrap{width:calc(100% - 36px);max-width:var(--max);margin-inline:auto;min-width:0}header{position:sticky;top:0;z-index:20;background:rgba(8,9,9,.94);border-bottom:1px solid #202020}.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.brand img{width:164px}.back{color:#e8c46f;font-weight:800}.hero{padding:72px 0 42px}.eyebrow,.tag{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.18em}.hero h1{font-size:clamp(36px,7vw,64px);line-height:1.15;margin:10px 0}.hero p{max-width:760px;color:#bbb}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 34px}.filter{border:1px solid #4c3b20;background:#17130c;color:#e8c46f;border-radius:999px;padding:7px 12px;font-size:12px;cursor:pointer}.filter.active{background:#e5ae42;color:#171208}.list{display:grid;grid-template-columns:minmax(0,1fr);gap:13px;padding-bottom:80px;width:100%;min-width:0}.card{background:linear-gradient(145deg,#15191d,#0e1012);border:1px solid #2b2d2f;border-radius:16px;padding:23px;width:100%;max-width:100%;min-width:0;overflow:hidden}.card h2{font-size:20px;line-height:1.5;margin:7px 0;max-width:100%;overflow-wrap:anywhere;word-break:break-word}.meta{color:#92918e;font-size:12px;overflow-wrap:anywhere}.notice{max-width:100%;overflow-wrap:anywhere}.card a.more{display:inline-block;margin-top:14px;color:#f0c35e;font-weight:800}.empty{padding:28px;border:1px solid #34302a;border-radius:16px;color:#aaa}.notice{border-left:3px solid var(--gold);padding:18px 20px;background:#15120c;color:#aaa;margin:0 0 30px}.notice strong{color:#f0c35e}footer{border-top:1px solid #202020;padding:32px 0 50px;color:#8e8e8e;font-size:12px}@media(max-width:780px){.wrap{width:calc(100% - 32px)}.nav{height:62px}.brand img{width:132px}.hero{padding:42px 0 34px}.hero h1{font-size:clamp(30px,9vw,42px)}.hero p{font-size:14px}.notice{padding:16px}.card{padding:18px}.card h2{font-size:18px}.filters{margin-bottom:26px}}</style><script async="" crossorigin="anonymous" src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9142850138364995"></script></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><img alt="DELIPIT" src="assets/delipit-logo.png"/></a><a class="back" href="index.html">← HOME</a></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">DRIVER NEWS</div><h1>配送の仕事に関係する、最新情報。</h1><p>法令・制度、安全、税・お金、物流など。公的な一次情報を中心に、軽貨物ドライバーに関係する情報をまとめます。</p><div class="filters" id="filters"></div><div class="notice"><strong>一次情報への入口として。</strong><br/>元記事の本文や画像を転載せず、発表元・公開日・タイトルと公式情報へのリンクを中心に掲載します。</div><div class="list" id="news-list"><div class="empty">最新情報を読み込んでいます…</div></div></div></section></main><footer><div class="wrap">© 2026 DELIPIT / REVERIE　｜　<a href="privacy.html">プライバシーポリシー</a>　｜　<a href="terms.html">利用規約</a></div></footer><script>
let all=[];const list=document.getElementById('news-list'),filters=document.getElementById('filters');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const url=v=>{try{const u=new URL(v,location.href);return /^https?:$/.test(u.protocol)?u.href:'#'}catch(e){return '#'}};function draw(cat='すべて'){const xs=cat==='すべて'?all:all.filter(x=>x.category===cat);list.innerHTML=xs.length?xs.map(x=>`<article class="card"><span class="tag">${esc(x.category||'DRIVER NEWS')}</span><h2>${esc(x.title)}</h2><div class="meta">${esc(x.publishedAt)}　｜　${esc(x.sourceName)}</div><a class="more" href="${url(x.sourceUrl)}" target="_blank" rel="noopener noreferrer">公式情報を見る →</a></article>`).join(''):'<div class="empty">現在、このカテゴリーの掲載情報はありません。</div>';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat))}fetch('data/driver-news.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{all=d.items||[];const cats=['すべて',...new Set(all.map(x=>x.category).filter(Boolean))];filters.innerHTML=cats.map(c=>`<button class="filter" data-cat="${esc(c)}">${esc(c)}</button>`).join('');filters.addEventListener('click',e=>{const b=e.target.closest('.filter');if(b)draw(b.dataset.cat)});draw()}).catch(()=>{list.innerHTML='<div class="empty">ニュースデータを取得できませんでした。前回データがある場合はサーバー側の更新処理をご確認ください。</div>'});
</script></body></html>
